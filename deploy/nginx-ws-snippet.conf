# EvoTrade — WebSocket behind nginx (merge into your server { } block).
# Without these lines, /ws often fails with code 1006 (abnormal closure).
#
# If the API is only under /api, still expose /ws at the site root (same host
# the browser uses), or change frontend WS_URL to match your path.

location /ws {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
